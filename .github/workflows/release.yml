name: Release

# Builds the SUBMISSION-GRADE bundle and attaches it (plus its audit
# artifacts and the certified white paper) to the GitHub release:
# certified SDK math run (production sims + Rust optimizer) → RTP assertion →
# package-for-stake --certified.
#
# Runs on every release tag, and on demand (workflow_dispatch) to attach a
# freshly built certified bundle to an existing release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the certified bundle to (e.g. v1.10.0)
        required: true
      base_sims:
        description: Base-mode sim count for the certified run
        required: false
        default: '1000000'
      bonus_sims:
        description: Bonus-mode sim count for the certified run
        required: false
        default: '200000'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Certified Stake Engine bundle
    runs-on: ubuntu-latest
    # Production-count sims + the Rust optimizer take a while on a 4-core runner.
    timeout-minutes: 240
    env:
      PYTHONHASHSEED: '0'
      SDK_BASE_SIMS: ${{ inputs.base_sims || '1000000' }}
      SDK_BONUS_SIMS: ${{ inputs.bonus_sims || '200000' }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Python 3.12 is the SDK's required interpreter; the standalone scripts
      # (stdlib-only) run fine under it too.
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Rust toolchain (SDK optimizer)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.5.0

      - name: Set up Node 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Certified math run (official SDK + Rust optimizer)
        run: bash scripts/run-certification.sh novaforged

      - name: Assert certified RTP converged to target
        run: python3.12 scripts/assert_certified_rtp.py --tol 0.03 novaforged

      - name: Package the certified bundle
        run: bash scripts/package-for-stake.sh novaforged --certified

      - name: Stage release assets
        id: assets
        run: |
          mkdir -p release-assets
          cp dist-stake/*.zip release-assets/
          cp dist-stake/novaforged/MANIFEST.md release-assets/novaforged-MANIFEST.md
          cp dist-stake/novaforged/submission-manifest.json release-assets/novaforged-submission-manifest.json
          cp dist-stake/novaforged/SHA256SUMS release-assets/novaforged-SHA256SUMS.txt
          cp dist-stake/novaforged/sbom.cdx.json release-assets/novaforged-sbom.cdx.json
          cp dist-stake/novaforged/upload-instructions.txt release-assets/novaforged-upload-instructions.txt
          cp docs/white-papers/novaforged-white-paper.md release-assets/novaforged-white-paper.md
          ls -la release-assets/

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stake-bundle
          path: release-assets/
          if-no-files-found: error

      - name: Attach certified bundle + audit artifacts to the GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true
